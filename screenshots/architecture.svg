<svg viewBox="0 0 680 456" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Spotify App MVVM architecture</title>
<desc>Four layers: Compose screens, ViewModels with StateFlow, Repositories and ExoPlayer module, data sources Ktor backend and Room.</desc>
