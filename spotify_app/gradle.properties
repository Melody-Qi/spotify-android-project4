# --- Build environment (this machine) ---
# Use Android Studio's bundled JDK 17 instead of the D:\bin java shim (whose java.home
# resolves to D:\ and breaks Gradle).
org.gradle.java.home=D:\\AndroidStudio\\jbr
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 37 is newer than what AGP was tested with; this silences the warning
# instead of failing.
android.suppressUnsupportedCompileSdk=37

# --- Network (Clash local proxy; remove these two blocks if the proxy is off) ---
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# --- Lesson 55: KSP + built-in Kotlin ---
# KSP registers its generated sources through the `kotlin.sourceSets` DSL, which AGP 9
# forbids now that Kotlin is built in ("Use android.sourceSets DSL instead"). AGP ships
# this flag to keep older plugins working; without it the :app configuration fails.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
